:root {
  --ink: #3a2537;
  --body: #ffc6d5;
  --key: #d6e9ff; --key-dk: #aecdf2;
  --op: #e6dbff; --op-dk: #c7b6f2;
  --disc: #ff9f8e; --disc-dk: #ec7c68;
  --tax: #c2f0d8; --tax-dk: #93dcb7;
  --ac: #ffe28a; --ac-dk: #f2c55a;
  --eq: #ff94b8; --eq-dk: #ec6f98;
  --lcd: #e1eacb;
  --seg: #2c3527;
  --page: #fff3f6;
  --dots: rgba(240, 150, 180, .3);
  --w: min(92vw, 320px, calc((100vh - 4rem) * .48));
}
@media (prefers-color-scheme: dark) {
  :root { --page: #1f171b; --dots: rgba(255, 255, 255, .06); }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  background-color: var(--page);
  background-image: radial-gradient(circle, var(--dots) 1.5px, transparent 2px);
  background-size: 24px 24px;
  font-family: PJS, "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.stage { padding: 2rem 16px; }
/* macOS app: transparent window, only the calculator shows */
html.app, html.app body { background: transparent; }
html.app body { overflow: hidden; }
html.app .stage { padding: 0; }
html.app .calc { --w: calc(100vw - 56px); }

.calc {
  position: relative;
  width: var(--w);
  height: calc(var(--w) * 2.08);
  font-size: calc(var(--w) / 100); /* 1em = 1% of the calculator width */
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* paper tape */
.tape {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 22em;
  width: 56em;
  height: 47.5em;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(transparent, #000 35%);
  mask-image: linear-gradient(transparent, #000 35%);
}
.tape ol {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 16em;
  margin: 0;
  padding: 3em 4em 4.6em;
  list-style: none;
  background: #fffdf7;
  border: .5em solid var(--ink);
  border-bottom: 0;
}
.tape li {
  display: flex;
  justify-content: space-between;
  gap: 1em;
  height: 1.6em;
  overflow: hidden;
  white-space: nowrap;
  font: 600 4.2em/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.tape li.new { animation: feed .28s ease-out; }
@keyframes feed { from { height: 0; opacity: 0; } }
.tape li.start:not(:first-child) { margin-top: .7em; }
.tape li.total { font-weight: 800; border-top: .12em dashed var(--ink); }
.tape li.saved { color: #d4502f; font-weight: 800; }
.tape.tear ol { animation: tear .45s ease-in forwards; }
@keyframes tear { to { transform: translateY(-110%) rotate(-3deg); opacity: 0; } }

/* body */
.body {
  position: absolute;
  top: 44em;
  left: 0;
  width: 100em;
  height: 164em;
  background: var(--body);
  border: .8em solid var(--ink);
  border-radius: 12em 12em 14em 14em;
  box-shadow:
    inset 0 1.6em 0 rgba(255, 255, 255, .45),
    inset 0 -2em 0 rgba(200, 80, 120, .12),
    0 4em 6em -2em rgba(200, 90, 130, .35);
}
.ear { position: absolute; top: 34em; width: 22em; height: 22em; border-radius: 50%; background: var(--body); border: .8em solid var(--ink); }
.ear::after { content: ""; position: absolute; inset: 4.6em; border-radius: 50%; background: #ffe4ec; }
.ear.l { left: .5em; }
.ear.r { right: .5em; }
.slot { position: absolute; z-index: 3; top: 46.3em; left: 20em; width: 60em; height: 2.6em; background: var(--ink); border-radius: 2em; }
.brand { position: absolute; top: 7.5em; left: 8.5em; line-height: 1; }
.brand b { display: block; font-size: 5.6em; font-weight: 800; letter-spacing: .06em; }
.brand small { display: block; margin-top: .6em; font-size: 2.8em; font-weight: 800; letter-spacing: .14em; opacity: .55; }
.solar {
  position: absolute;
  top: 6.5em;
  right: 8.5em;
  width: 31em;
  height: 10em;
  border: .7em solid var(--ink);
  border-radius: 1.8em;
  background: repeating-linear-gradient(90deg, #4a3f55 0 6.9em, #6b5d78 6.9em 7.4em);
  box-shadow: inset 0 .8em 0 rgba(255, 255, 255, .12);
}

/* LCD */
.lcd { position: absolute; top: 20em; left: 6em; right: 6em; height: 32em; padding: 3em; background: #f2a3bb; border: .8em solid var(--ink); border-radius: 4.5em; }
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2.2em 3em;
  background: var(--lcd);
  border-radius: 2.2em;
  box-shadow: inset 0 .9em 0 rgba(0, 0, 0, .12);
}
.ann { display: flex; justify-content: space-between; height: 1.2em; color: var(--seg); font-size: 3.4em; font-weight: 800; letter-spacing: .08em; }
#lcd svg { display: block; width: 100%; height: auto; }
#lcd .on { fill: var(--seg); }
#lcd .off { fill: var(--seg); opacity: .08; }
#lcd path.on { fill: none; stroke: var(--seg); stroke-linecap: round; }

/* keys */
.keys { position: absolute; top: 58em; left: 7em; right: 7em; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 13em; gap: 3.8em; }
.k {
  display: grid;
  place-items: center;
  align-content: center;
  margin: 0;
  padding: 0;
  font: inherit;
  color: var(--ink);
  background: var(--kc, var(--key));
  border: .7em solid var(--ink);
  border-radius: 3.6em;
  box-shadow: inset 0 -1.7em 0 var(--kd, var(--key-dk)), 0 1.2em 0 rgba(58, 37, 55, .35);
  cursor: pointer;
  transition: transform .07s, box-shadow .07s;
}
.k span { font-size: 6.2em; font-weight: 800; line-height: 1; }
.k small { display: block; margin-bottom: .25em; font-size: 2.5em; font-weight: 800; letter-spacing: .1em; opacity: .7; }
.k svg { width: 7.5em; height: 7.5em; }
.k.press { transform: translateY(1em); box-shadow: inset 0 -.8em 0 var(--kd, var(--key-dk)), 0 .2em 0 rgba(58, 37, 55, .35); }
.k:focus-visible { outline: .7em solid #6fb3ff; outline-offset: .6em; }
.k.op { --kc: var(--op); --kd: var(--op-dk); }
.k.disc { --kc: var(--disc); --kd: var(--disc-dk); }
.k.tax { --kc: var(--tax); --kd: var(--tax-dk); }
.k.ac { --kc: var(--ac); --kd: var(--ac-dk); }
.k.eq { --kc: var(--eq); --kd: var(--eq-dk); grid-column: 1 / -1; }
.k.small span { font-size: 5em; }
</style>
</head>

        <button class="k" data-k="0"><span>0</span></button>
        <button class="k small" data-k="000"><span>000</span></button>
        <button class="k" data-k="." aria-label="Decimal point"><span>.</span></button>
        <button class="k op" data-k="+" aria-label="Plus"><span>+</span></button>
        <button class="k eq" data-k="=" aria-label="Equals"><span>=</span></button>
      </div>
    </div>
  </div>
</main>

<script>
const KEY = 'salecalc:v1';
const CELLS = 12; // digits on the LCD
const $ = s => document.querySelector(s);

const S = Object.assign(
  { entry: '0', acc: null, op: null, fresh: true, err: false, offs: [], saved: 0, tape: [] },
  (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })()
);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ---------- math ----------
   Works like a pocket calculator: each key applies to the running total.
   −% takes a percentage off, +% adds one (tax, service). */
const OPS = {
  '+': (a, b) => a + b,
  '-': (a, b) => a - b,
  '*': (a, b) => a * b,
  '/': (a, b) => a / b,
  '-%': (a, b) => a - a * b / 100,
  '+%': (a, b) => a + a * b / 100,
};
const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', '-%': '−%', '+%': '+%' };
const round2 = n => Math.round(n * 100) / 100;
const fmt = n => isFinite(n) ? round2(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) : 'E';
const num = s => parseFloat(s) || 0;
const label = (op, b) => op.includes('%') ? `${op[0] === '-' ? '−' : '+'}${fmt(b)}%` : `${SYM[op]} ${fmt(b)}`;
// stacked discounts multiply: 50% then 20% off is 60% off in total, not 70%
const off = () => 100 * (1 - S.offs.reduce((p, d) => p * (1 - d / 100), 1));

function digit(d) {
  if (S.fresh) {
    if (S.acc === null) S.offs = [];
    S.entry = '0';
    S.fresh = false;
  }
  if (d === '.') { if (!S.entry.includes('.')) S.entry += '.'; return; }
  const e = (S.entry + d).replace(/^0+(?=\d)/, '');
  if (e.replace(/\D/g, '').length <= CELLS) S.entry = e;
}
function back() {
  if (!S.fresh) S.entry = S.entry.length > 1 ? S.entry.slice(0, -1) : '0';
}
function apply(b) {
  const before = S.acc, r = OPS[S.op](S.acc, b);
  if (!isFinite(r)) {
    print(label(S.op, b), 'ERROR');
    Object.assign(S, { err: true, acc: null, op: null });
    return false;
  }
  S.acc = r;
  if (S.op === '-%') { S.offs.push(b); S.saved += before - r; }
  print(label(S.op, b), r);
  return true;
}
function operate(op) {
  if (S.acc === null) {
    S.acc = num(S.entry);
    S.offs = [];
    S.saved = 0;
    print('START', S.acc, 'start');
  } else if (!S.fresh && !apply(num(S.entry))) return;
  S.op = op;
  S.fresh = true;
}
function equals() {
  if (S.acc === null || !S.op) return;
  if (!S.fresh && !apply(num(S.entry))) return;
  print('TOTAL', S.acc, 'total');
  if (S.offs.length) { print('SAVED', S.saved, 'saved'); print('TOTAL OFF', `${fmt(off())}%`, 'saved'); }
  Object.assign(S, { entry: String(round2(S.acc)), acc: null, op: null, fresh: true });
}
function clearAll() {
  const old = [...$('#tape').children];
  Object.assign(S, { entry: '0', acc: null, op: null, fresh: true, err: false, offs: [], saved: 0, tape: [] });
  if (!old.length) return;
  const t = $('.tape');
  t.classList.add('tear'); // tear the paper off
  setTimeout(() => { old.forEach(li => li.remove()); t.classList.remove('tear'); }, 450);
}

/* ---------- paper tape ---------- */
function line([l, r, kind], fresh) {
  const li = document.createElement('li');
  li.className = `${kind || ''}${fresh ? ' new' : ''}`;
  li.innerHTML = `<span>${l}</span><b>${r}</b>`;
  return li;
}
function print(l, r, kind) {
  const row = [l, typeof r === 'number' ? fmt(r) : r, kind];
  S.tape.push(row);
  if (S.tape.length > 40) { S.tape.shift(); $('#tape').firstElementChild?.remove(); }
  $('#tape').append(line(row, true));
  zip();
}

/* ---------- LCD: 7-segment digits drawn in SVG ---------- */
const T = 10, G = 1.6, W = 56, H = 100, CELL = 66;
const hs = y => { const a = T / 2 + G, b = W - T / 2 - G; return [[a, y], [a + T / 2, y - T / 2], [b - T / 2, y - T / 2], [b, y], [b - T / 2, y + T / 2], [a + T / 2, y + T / 2]]; };
const vs = (x, y1, y2) => { y1 += G; y2 -= G; return [[x, y1], [x + T / 2, y1 + T / 2], [x + T / 2, y2 - T / 2], [x, y2], [x - T / 2, y2 - T / 2], [x - T / 2, y1 + T / 2]]; };
const SEG = { a: hs(T / 2), b: vs(W - T / 2, T / 2, H / 2), c: vs(W - T / 2, H / 2, H - T / 2), d: hs(H - T / 2), e: vs(T / 2, H / 2, H - T / 2), f: vs(T / 2, T / 2, H / 2), g: hs(H / 2) };
const LIT = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', E: 'adefg' };
function lcd(text) {
  const cells = [];
  for (const ch of text) {
    if ((ch === '.' || ch === ',') && cells.length) cells[cells.length - 1][ch === '.' ? 'dp' : 'cm'] = true;
    else cells.push({ ch });
  }
  while (cells.length < CELLS) cells.unshift({ ch: ' ' });
  const poly = (p, on) => `<polygon class="${on ? 'on' : 'off'}" points="${p.map(q => q.join(',')).join(' ')}"/>`;
  return `<svg viewBox="0 -2 ${CELLS * CELL + 16} 118" aria-label="${text}">` + cells.map((c, i) => {
    let g = '';
    for (const s in SEG) g += poly(SEG[s], (LIT[c.ch] || '').includes(s));
    g += `<circle class="${c.dp || c.cm ? 'on' : 'off'}" cx="${W + 6}" cy="${H - 4}" r="4.8"/>`;
    if (c.cm) g += `<path class="on" d="M${W + 9} ${H - 2}q0 9-7 13" stroke-width="3.4"/>`;
    return `<g transform="translate(${i * CELL + 12} 0) skewX(-6)">${g}</g>`;
  }).join('') + '</svg>';
}
function showEntry(e) {
  const [i, f] = e.split('.');
  return Number(i).toLocaleString('en-US') + (e.includes('.') ? '.' + f : '');
}
function render() {
  const text = S.err ? 'E' : !S.fresh ? showEntry(S.entry) : fmt(S.acc !== null ? S.acc : num(S.entry));
  $('#lcd').innerHTML = lcd(text.replace(/\D/g, '').length > CELLS ? 'E' : text);
  $('#annOp').textContent = S.op ? SYM[S.op] : '';
  $('#annOff').textContent = S.offs.length ? `TOTAL OFF ${fmt(off())}%` : '';
}

/* ---------- sound ---------- */
let ac = null, noise = null;
function audio() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
  if (ac && ac.state !== 'running') ac.resume().catch(() => {});
}
function click() {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(1100, t);
  o.frequency.exponentialRampToValueAtTime(600, t + 0.04);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.06);
}
function zip() { // tiny dot-matrix printer
  if (!ac || ac.state !== 'running') return;
  if (!noise) {
    noise = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  for (let i = 0; i < 2; i++) {
    const t = ac.currentTime + i * 0.07, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise;
    f.type = 'bandpass';
    f.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(f).connect(g).connect(ac.destination);
    s.start(t);
    s.stop(t + 0.07);
  }
}

/* ---------- input ---------- */
function press(k) {
  audio();
  click();
  if (S.err && k !== 'ac') Object.assign(S, { err: false, acc: null, op: null, entry: '0', fresh: true });
  if (/^(\d|000|\.)$/.test(k)) digit(k);
  else if (k === 'back') back();
  else if (k === 'ac') clearAll();
  else if (k === '=') equals();
  else operate(k);
  save();
  render();
}
function flash(k) {
  const el = document.querySelector(`[data-k="${k}"]`);
  if (!el) return;
  el.classList.add('press');
  setTimeout(() => el.classList.remove('press'), 110);
}
document.querySelectorAll('[data-k]').forEach(el => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); press(el.dataset.k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, () => el.classList.remove('press')));
});
const KEYS = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'ac', Delete: 'ac', '*': '*', x: '*', '/': '/', '+': '+', '-': '-', '%': '-%', d: '-%', t: '+%', '.': '.', ',': '.' };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = /^\d$/.test(e.key) ? e.key : KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!k) return;
  e.preventDefault();
  flash(k);
  press(k);
});

// macOS app: dragging the calculator body or the tape moves the window
const dragMsg = window.webkit?.messageHandlers?.drag;
if (dragMsg) {
  let over = false;
  addEventListener('pointerover', e => {
    const o = !!e.target.closest('.drag') && !e.target.closest('button'); // keys sit inside the body but must stay clickable
    if (o !== over) dragMsg.postMessage(over = o);
  });
}

S.tape.forEach(row => $('#tape').append(line(row)));
$('#lcd').innerHTML = lcd('8.8.8.8.8.8.8.8.8.8.8.8.'); // power-on flash
setTimeout(render, 350);
</script>
</body>
</html>
